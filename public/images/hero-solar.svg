<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="40%" stop-color="#132d56"/>
      <stop offset="100%" stop-color="#1a6fc4"/>
    </linearGradient>
    <linearGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b731"/>
      <stop offset="100%" stop-color="#d49a1a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0f2140"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="1400" cy="200" r="180" fill="#f5b731" opacity="0.15"/>
  <circle cx="1400" cy="200" r="100" fill="#f5b731" opacity="0.3"/>
  <circle cx="1400" cy="200" r="60" fill="#f5b731" opacity="0.8"/>
  <!-- Solar panels row 1 -->
  <g transform="translate(200, 500) skewY(-5)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="url(#panel)" stroke="#2196f3" stroke-width="1" opacity="0.9"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="0" x2="100" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="150" y1="0" x2="150" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="43" x2="200" y2="43" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="86" x2="200" y2="86" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g transform="translate(420, 490) skewY(-5)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="url(#panel)" stroke="#2196f3" stroke-width="1" opacity="0.9"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="0" x2="100" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="150" y1="0" x2="150" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="43" x2="200" y2="43" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="86" x2="200" y2="86" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g transform="translate(640, 480) skewY(-5)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="url(#panel)" stroke="#2196f3" stroke-width="1" opacity="0.9"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="0" x2="100" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="150" y1="0" x2="150" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="43" x2="200" y2="43" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="86" x2="200" y2="86" stroke="#2196f3" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Solar panels row 2 -->
  <g transform="translate(300, 650) skewY(-5)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="url(#panel)" stroke="#2196f3" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="0" x2="100" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="150" y1="0" x2="150" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="43" x2="200" y2="43" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="86" x2="200" y2="86" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
  </g>
  <g transform="translate(520, 640) skewY(-5)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="url(#panel)" stroke="#2196f3" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="0" x2="100" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="150" y1="0" x2="150" y2="130" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="43" x2="200" y2="43" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="86" x2="200" y2="86" stroke="#2196f3" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Roof shape -->
  <polygon points="900,350 1600,450 1600,700 900,600" fill="#0f2140" stroke="#1a6fc4" stroke-width="1" opacity="0.5"/>
  <!-- Rooftop panels -->
  <g transform="translate(950, 380) skewY(5)">
    <rect x="0" y="0" width="180" height="100" rx="3" fill="url(#panel)" stroke="#00a8ff" stroke-width="1" opacity="0.8"/>
    <line x1="45" y1="0" x2="45" y2="100" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="90" y1="0" x2="90" y2="100" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="135" y1="0" x2="135" y2="100" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="33" x2="180" y2="33" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="66" x2="180" y2="66" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g transform="translate(1150, 400) skewY(5)">
    <rect x="0" y="0" width="180" height="100" rx="3" fill="url(#panel)" stroke="#00a8ff" stroke-width="1" opacity="0.8"/>
    <line x1="45" y1="0" x2="45" y2="100" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="90" y1="0" x2="90" y2="100" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="135" y1="0" x2="135" y2="100" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="33" x2="180" y2="33" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="66" x2="180" y2="66" stroke="#00a8ff" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="850" width="1920" height="230" fill="#081220" opacity="0.8"/>
  <!-- Light rays from sun -->
  <line x1="1400" y1="200" x2="800" y2="500" stroke="#f5b731" stroke-width="1" opacity="0.1"/>
  <line x1="1400" y1="200" x2="600" y2="600" stroke="#f5b731" stroke-width="1" opacity="0.08"/>
  <line x1="1400" y1="200" x2="1000" y2="400" stroke="#f5b731" stroke-width="1" opacity="0.1"/>
</svg>
